version: "v0.4"

project:
  name: "Gaussian separation and equal-cardinality partition"
  description: >-
    A Lean 4 translation of the pointwise equivalence between a Gaussian
    gadget-and-schedule hinge bound and equal-cardinality partition of
    perfect-square inputs. The threshold depends on the selector. General
    Karamata inequality and the zero-selector lemma are auxiliary results.
  authors: []
  license: "Apache-2.0"
  responsible_maintainers: []
  authorship_note: >-
    Actual formalization authors and responsible maintainers await user
    confirmation before submission. The manuscript's template author block
    has not been copied as a bibliographic attribution.

