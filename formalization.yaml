fidelity:
  divergences: >-
    The development uses functions Fin n -> Real and lists instead of Rocq
    Vector.t values. Scalar schedule recursions become finite sums, and
    covariances are factored as in the source's proved factorization. The
    main statement retains d > 1, half-total at least 1, natural-square
    coordinates, and the threshold's dependence on the zeroth selector
    coordinate. Its Gaussian count is 2*d+3 in dimension 2*d.
    Karamata's domain convexity and conditional function
    convexity are bundled as convexOnPredicate, proved equivalent to Mathlib
    ConvexOn. Equal coordinates are handled by extending secant slopes rather
    than deleting coordinates. The mathematical Karamata assumptions and
    conclusion match the source. The full Rocq development is not covered.

review:
  status: "agent-reviewed"
  reviewers: ["Codex agents"]
  notes: >-
    Auxiliary Karamata and gadget proofs passed local Lean checks. Karamata
    examples covered empty vectors, identical vectors, and a closed interval
    with shared coordinates. Agents reviewed source fidelity and mathematical
    context. Main-theorem build and axiom inspection passed. A local audit
    imported Challenge and Solution into separate environments and checked
    exact equality of the main theorem types and 42 definition bodies.
    The Solution does not import Challenge. Palomar's pinned metadata validator
    and the repository submission preflight pass with the confirmed author
    and responsible maintainer.
    CI includes full Comparator and NanoDa replay, but that job has not yet run.
    No independent human mathematical review or Palomar submission has occurred.

