version: "v0.4"

project:
  name: "Gaussian separation and equal-cardinality partition"
  description: >-
    A Lean 4 proof development of Tomislav Prusina's original reduction idea
    toward NP-hardness of feature selection for relative
    Gaussian c-separation in the formulation of Borozan et al. The argument
    starts from NP-completeness of equal-cardinality partition of positive
    squares, giving integral Gaussian data via integer roots and an even
    paired total. Three Gaussians enforce partition balance, and a schedule
    of d+1 Gaussians enforces binary selectors. Explicit separation of the
    two blocks makes cross-block hinge penalties vanish. The fixed threshold
    is (dot s 1 / 2)*d*(d+1)/2 - 3*d/4, an integer multiple of 1/4
    for natural input weights. Here d is the full dimension. The main proved result is the
    pointwise gadget iff. The full
    complexity reduction is not formalized. The threshold depends only on the input.
    General Karamata inequality and an unconditional ordinary-PARTITION to
    positive-square equal-cardinality partition equivalence are auxiliary
    results stated in Solution.lean. The square encoding has proved injectivity
    and numerical size bounds; its NP-completeness argument is documented prose.
    The original Gaussian gadget predicate also has a proved binary certificate
    verifier with soundness, completeness, and quadratic work in a bit-cost model.
  authors: ["Tomislav Prusina"]
  license: "Apache-2.0"
  responsible_maintainers: ["Tomislav Prusina"]
  authorship_note: >-
    Tomislav Prusina is the author of the original reduction idea, the
    formalization author, and the responsible maintainer, as confirmed by
    the user.

