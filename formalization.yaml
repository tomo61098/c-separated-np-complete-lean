    relationship: "adapts"
    note: "The accompanying Rocq gadget, schedule, and final equivalence proofs."
  - id: "RocqOld/Karamata.v"
    relationship: "adapts"
    note: "The accompanying Rocq proof is the source of the Lean Karamata translation."
  - id: "RocqOld/Square.v"
    relationship: "adapts"
    note: >-
      Translates square_partition_implies_partition_for_choice and
      exists_square_partition_implies_exists_partition. Adds the converse
      for paired Boolean choices and connects the natural squares to the
      existing real-vector equal-cardinality partition predicate. The separate
      SquareReduction module strengthens this with shifted indices, an explicit
      base, a proof for arbitrary target selectors, injectivity, and size bounds.

status:
  scope: >-
    The sole submission target is partition_gadget_schedule_partition_iff.
    The main theorem and its dependencies are proved, lake build passes,
    and main-theorem axiom inspection found only the three standard axioms.
    The result is a pointwise equivalence with a selector-dependent
    threshold, in dimension 2*d with 2*d+3 Gaussian classes. For this Gaussian
    result, NP-hardness,
    polynomial-time encoding, NP membership, and approximation guarantees
    are outside the formalized scope.
    The auxiliary square reduction proves unconditional equivalence from ordinary
    PARTITION to equal-cardinality partition of positive squares, together with
    injectivity and numerical encoding bounds. SQUARE_PARTITION.md proves the
    polynomial-time and NP-membership claims in prose and derives NP-completeness
    from the standard PARTITION result. These complexity claims are not
    machine-model theorems in Lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "CSeparatedNPComplete.partition_gadget_schedule_partition_iff"
      file: "Solution.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      verification_status: "Lean build, independent statement and definition comparison, and axiom audit passed; full Comparator verification pending"

