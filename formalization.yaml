    - method: "agent"
      models: ["GPT-6"]
      framework: "Codex"
      tool_setup: "Local Mathlib source inspection, collaborative proof development, and Lean builds"
      prompting_notes: >-
        Translate the final equivalence in RocqOld/sepsolve.v and its Gaussian
        construction. Prove general Karamata inequality using as much
        Mathlib as possible, with RocqOld/Karamata.v as a reference. Preserve
        the source scope and explain the Gaussian feature-selection motivation.
        Translate the supplied RocqOld/Square.v results and check whether
        they establish the requested equal-cardinality reduction. Strengthen
        the construction to reduce ordinary positive-integer PARTITION with
        an explicit base and a reverse implication for arbitrary selectors.
  spend_usd: "not tracked"
  notes: >-
    The Lean translation was developed with AI assistance, including parallel
    proof development, source review, and Lean checking. The main theorem
    is complete; independent human review remains pending.

fidelity:
  divergences: >-
    The development uses functions Fin n -> Real and lists instead of Rocq
    Vector.t values. Scalar schedule recursions become finite sums, and
    covariances are factored as in the source's proved factorization. The
    main statement retains d > 1, half-total at least 1, natural-square
    coordinates, and the threshold's dependence on the zeroth selector
    coordinate. Its Gaussian count is 2*d+3 in dimension 2*d.
    Karamata's domain convexity and conditional function
    convexity are bundled as convexOnPredicate, proved equivalent to Mathlib
    ConvexOn. Equal coordinates are handled by extending secant slopes rather
    than deleting coordinates. The mathematical Karamata assumptions and
    conclusion match the source. The full Rocq development is not covered.
    The Square.v translation replaces sum_upto with finite sums and retains
    K >= 1 and a_i <= K^(2*i). The square selectors choose exactly one element
    per pair; the original-weight sum equality does not require equal
    cardinality. For (1,1,1,3) at K=2, the constructed squares admit a paired
    equal-cardinality partition although the original input has no such
    partition. The separate strengthened construction uses indices 1 through n
    and K = 2+n+2*sum(a_i)+sum(a_i^2). It proves that every balanced square
    selector splits all pairs, so the reduction source is ordinary PARTITION.
    Correctness, positive-square outputs, injectivity, and numerical size bounds
    are formalized. Running time, NP membership, and the NP-completeness
    consequence are proved in prose in SQUARE_PARTITION.md.

review:
  status: "agent-reviewed"
  reviewers: ["Codex agents"]
  notes: >-
    Auxiliary Karamata and gadget proofs passed local Lean checks. Karamata
    examples covered empty vectors, identical vectors, and a closed interval
    with shared coordinates. Agents reviewed source fidelity and mathematical
    context. Main-theorem build and axiom inspection passed. A local audit
    imported Challenge and Solution into separate environments and checked
    exact equality of the main theorem types and 42 definition bodies.
    The Solution does not import Challenge. Palomar's pinned metadata validator
    and the repository submission preflight pass with the confirmed author
    and responsible maintainer.
    The translated Square.v results and the equal-cardinality counterexample
    passed Lean checks. Their axiom audits found only the three
    standard axioms. The unconditional reduction, positivity, injectivity, and
    numerical bounds passed the full build; positive yes- and no-instance checks
    and axiom audits also passed on 2026-09-08. CI includes full Comparator and NanoDa replay, but a
    successful full replay has not yet been confirmed.
    No independent human mathematical review or Palomar submission has occurred.

alignment:
  namespace: "CSeparatedNPComplete"
  statements:
    - source: "RocqOld/Karamata.v: Karamata_inequality"
      lean: "CSeparatedNPComplete.Karamata_inequality"
      module: "Solution"
      status: "proved"
      note: "Auxiliary library result; all finite dimensions, convex predicate domain, descending majorization."
    - source: "RocqOld/sepsolve.v:2782, partition_gadget_schedule_partition_iff"
      lean: "CSeparatedNPComplete.partition_gadget_schedule_partition_iff"
      module: "Solution"
      status: "proved"
      note: "Sole compared theorem; preserves the pointwise equivalence and selector-dependent threshold."
    - source: "RocqOld/Square.v: square_partition_implies_partition_for_choice"
      lean: "CSeparatedNPComplete.square_partition_implies_partition_for_choice"
      module: "Solution"
      status: "proved"
      note: "Preserves the source's paired-choice and root-bound hypotheses."
    - source: "RocqOld/Square.v: exists_square_partition_implies_exists_partition"
      lean: "CSeparatedNPComplete.exists_square_partition_implies_exists_partition"
      module: "Solution"
      status: "proved"
      note: "Existential implication for paired square partitions to original sum partitions."
    - source: "RocqOld/Square.v: left_decomp, with the converse derived in Lean"
      lean: "CSeparatedNPComplete.exists_square_partition_iff_exists_partition"
      module: "Solution"
      status: "proved"
      note: "Existential equivalence for paired choices; not an unrestricted Karp reduction."
    - source: "Bridge from the Square.v construction to the sepsolve.v predicate"
      lean: "CSeparatedNPComplete.square_choice_is_ec_partition_iff"
      module: "Solution"
      status: "proved"
      note: "Paired selectors partition the perfect-square vector iff they balance the original weights."
    - source: "Strengthened Square.v construction; SQUARE_PARTITION.md"
      lean: "CSeparatedNPComplete.partition_iff_square_ec_partition"
      module: "Solution"
      status: "proved"
      note: "Explicit base; ordinary PARTITION iff an arbitrary equal-cardinality partition of positive squares exists."
    - source: "Positive-square outputs of the strengthened construction"
      lean: "CSeparatedNPComplete.square_reduction_positive_squares"
      module: "Solution"
      status: "proved"
      note: "Every output coordinate is a positive natural square."

acknowledgements: "Lean 4, Mathlib, Rocq source development, and Palomar Registry guidance."
