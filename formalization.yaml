    and all 42 independent definition bodies still match Challenge.
    No independent human mathematical review or Palomar submission has occurred.

alignment:
  namespace: "CSeparatedNPComplete"
  statements:
    - source: "Karamata's inequality on a convex predicate domain"
      lean: "CSeparatedNPComplete.Karamata_inequality"
      module: "Solution"
      status: "proved"
      note: "Auxiliary library result; all finite dimensions, convex predicate domain, descending majorization."
    - source: "Pointwise Gaussian gadget equivalence; README.md"
      lean: "CSeparatedNPComplete.partition_gadget_schedule_partition_iff"
      module: "Solution"
      status: "proved"
      note: "Sole compared theorem; pointwise equivalence with a fixed threshold in the full dimension d."
    - source: "Paired-square partition implies original-weight partition"
      lean: "CSeparatedNPComplete.square_partition_implies_partition_for_choice"
      module: "CSeparatedNPComplete.SquarePartitionResults"
      status: "proved"
      note: "Assumes paired choices and bounds on the roots."
    - source: "Existence of paired-square partitions implies existence of original-weight partitions"
      lean: "CSeparatedNPComplete.exists_square_partition_implies_exists_partition"
      module: "CSeparatedNPComplete.SquarePartitionResults"
      status: "proved"
      note: "Existential implication for paired square partitions to original sum partitions."
    - source: "Partition equivalence for paired Boolean choices"
      lean: "CSeparatedNPComplete.exists_square_partition_iff_exists_partition"
      module: "CSeparatedNPComplete.SquarePartitionResults"
      status: "proved"
      note: "Existential equivalence for paired choices; not an unrestricted Karp reduction."
    - source: "Paired-square construction and the real-vector equal-cardinality partition predicate"
      lean: "CSeparatedNPComplete.square_choice_is_ec_partition_iff"
      module: "CSeparatedNPComplete.SquarePartitionResults"
      status: "proved"
      note: "Paired selectors partition the perfect-square vector iff they balance the original weights."
    - source: "Unrestricted square reduction; SQUARE_PARTITION.md"
      lean: "CSeparatedNPComplete.partition_iff_square_ec_partition"
      module: "Solution"
      status: "proved"
      note: "Explicit base; ordinary PARTITION iff an arbitrary equal-cardinality partition of positive squares exists."
    - source: "Positive-square outputs of the strengthened construction"
      lean: "CSeparatedNPComplete.square_reduction_positive_squares"
      module: "CSeparatedNPComplete.SquarePartitionResults"
      status: "proved"
      note: "Every output coordinate is a positive natural square."
    - source: "Polynomial certificate derived from the original gadget iff; CERTIFICATES.md"
      lean: "CSeparatedNPComplete.PolynomialCertificate.gadget_polynomial_certificate"
      module: "CSeparatedNPComplete.PolynomialCertificate"
      status: "proved"
      note: "Exact binary certificate, sound and complete integer verifier, quadratic work in the explicit bit-cost model."

