related_formalizations: []

status:
  scope: >-
    The sole submission target is partition_gadget_schedule_partition_iff.
    The main theorem and its dependencies are proved, lake build passes,
    and main-theorem axiom inspection found only the three standard axioms.
    The result is a pointwise equivalence with a fixed
    threshold, in dimension d with d+4 Gaussian classes. For this Gaussian
    result, a d-bit certificate and sound and complete integer verifier are
    formalized, with work at most 128*(L+1)^2 in the explicit binary-arithmetic
    cost model, where L encodes s. The dimension is at least 4, the weights are
    natural squares, and their half-total is at least one. General Gaussian NP membership, machine-model complexity theorems,
    the full reduction's encoding bounds, and approximation guarantees are
    outside the formalized scope.
    The auxiliary square reduction proves unconditional equivalence from ordinary
    PARTITION to equal-cardinality partition of positive squares, together with
    injectivity and numerical encoding bounds. SQUARE_PARTITION.md proves the
    polynomial-time and NP-membership claims in prose and derives NP-completeness
    from the standard PARTITION result. These complexity claims are not
    machine-model theorems in Lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "CSeparatedNPComplete.partition_gadget_schedule_partition_iff"
      file: "Solution.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      verification_status: "Lean build, independent statement and definition comparison, and axiom audit passed; full Comparator verification pending"

