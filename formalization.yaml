fidelity:
  divergences: >-
    The development uses functions Fin n -> Real and lists instead of Rocq
    Vector.t values. Scalar schedule recursions become finite sums, and
    covariances are factored as in the source's proved factorization. The
    main statement retains d > 1, half-total at least 1, natural-square
    coordinates, and the threshold's dependence on the zeroth selector
    coordinate. Its Gaussian count is 2*d+3 in dimension 2*d; the manuscript's
    introductory class-count claims do not replace the source definition.
    Karamata's domain convexity and conditional function
    convexity are bundled as convexOnPredicate, proved equivalent to Mathlib
    ConvexOn. Equal coordinates are handled by extending secant slopes rather
    than deleting coordinates. The mathematical Karamata assumptions and
    conclusion match the source. The full manuscript and Rocq development
    are not covered.

review:
  status: "agent-reviewed"
  reviewers: ["Codex agents"]
  notes: >-
    Auxiliary Karamata and gadget proofs passed local Lean checks. Karamata
    examples covered empty vectors, identical vectors, and a closed interval
    with shared coordinates. Agents reviewed source fidelity and manuscript
    context. Main-theorem build and axiom inspection passed. Independent
    statement comparison for the main theorem remains pending. No independent human mathematical
    review, full Comparator verification, or Palomar submission has occurred.

