version: "v0.4"

project:
  name: "Gaussian separation and equal-cardinality partition"
  description: >-
    A Lean 4 translation of the pointwise equivalence between a Gaussian
    gadget-and-schedule hinge bound and equal-cardinality partition of
    perfect-square inputs, toward NP-hardness of feature selection for relative
    Gaussian c-separation in the formulation of Borozan et al. The full
    complexity reduction is not formalized. The threshold depends on the selector. General
    Karamata inequality is the sole auxiliary theorem stated in Solution.lean.
  authors: ["Tomislav Prusina"]
  license: "Apache-2.0"
  responsible_maintainers: ["Tomislav Prusina"]
  authorship_note: >-
    Tomislav Prusina is the formalization author and responsible maintainer,
    as confirmed by the user.

classification:
  arxiv: ["cs.LO", "cs.CC"]
  msc2020: ["03B35", "68Q17"]

sources:
  - title: "Optimal Marker Genes for c-Separated Cell Types"
    authors:
      - "Bartol Borozan"
      - "Luka Borozan"
      - "Domagoj Ševerdija"
      - "Domagoj Matijević"
      - "Stefan Canzar"
    type: "paper"
    relationship: "background"
    id: "https://doi.org/10.1007/978-3-031-90252-9_53"
    location: "Research in Computational Molecular Biology, RECOMB 2025, LNCS 15647, pp. 424–427"
    note: >-
      Published background for the Gaussian c-separation feature-selection
      formulation. Relative separation measures class mean differences against
      within-class variation. The direct source of the gadget equivalence
      formalized here is the accompanying Rocq development.
  - title: "The accompanying Rocq development in this repository"
    type: "other"
    relationship: "adapts"
    id: "https://github.com/tomo61098/c-separated-np-complete-lean/blob/a23591d147d2f4b105bcab6125e4a242b6e458aa/sepsolve.v#L2782"
    location: "RocqOld/sepsolve.v:2782, partition_gadget_schedule_partition_iff"
    note: >-
      Direct reference for the main theorem's hypotheses, construction, and
      conclusion, including its selector-dependent threshold.
  - title: "Karamata's inequality in the accompanying Rocq development"
    type: "other"
    relationship: "adapts"
    location: "RocqOld/Karamata.v: Karamata_inequality"
    note: >-
      The Lean proof follows the secant-slope and summation-by-parts argument,
      replacing source infrastructure with Mathlib convexity, monotone
      extension, and Abel summation results.

related_formalizations:
  - id: "https://github.com/tomo61098/c-separated-np-complete-lean/blob/a23591d147d2f4b105bcab6125e4a242b6e458aa/sepsolve.v"
    relationship: "adapts"
    note: "The accompanying Rocq gadget, schedule, and final equivalence proofs."
  - id: "RocqOld/Karamata.v"
    relationship: "adapts"
    note: "The accompanying Rocq proof is the source of the Lean Karamata translation."

status:
  scope: >-
    The sole submission target is partition_gadget_schedule_partition_iff.
    The main theorem and its dependencies are proved, lake build passes,
    and main-theorem axiom inspection found only the three standard axioms.
    The result is a pointwise equivalence with a selector-dependent
    threshold, in dimension 2*d with 2*d+3 Gaussian classes. NP-hardness,
    polynomial-time encoding, NP membership, and approximation guarantees
    are outside the formalized scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "CSeparatedNPComplete.partition_gadget_schedule_partition_iff"
      file: "Solution.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      verification_status: "Lean build, independent statement and definition comparison, and axiom audit passed; full Comparator verification pending"

