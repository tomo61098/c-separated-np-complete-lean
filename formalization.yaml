fidelity:
  divergences: >-
    The development uses functions Fin n -> Real for vectors and lists for
    Gaussian collections. The scalar schedule uses finite sums and factored
    covariances. The
    main statement assumes d >= 4, half-total at least 1, and natural-square
    coordinates. The threshold is (dot s 1 / 2)*d*(d+1)/2 - 3*d/4.
    Its Gaussian count is d+4 in dimension d. Schedule class i > 0
    uses coordinate i-1, so all d coordinates contribute to the correction.
    Karamata's domain convexity and conditional function
    convexity are bundled as convexOnPredicate, proved equivalent to Mathlib
    ConvexOn. Equal coordinates are handled by extending secant slopes.
    The paired-square lemmas use finite sums and assume
    K >= 1 and a_i <= K^(2*i). The square selectors choose exactly one element
    per pair; the original-weight sum equality does not require equal
    cardinality. For (1,1,1,3) at K=2, the constructed squares admit a paired
    equal-cardinality partition although the original input has no such
    partition. The separate strengthened construction uses indices 1 through n
    and K = 2+n+2*sum(a_i)+sum(a_i^2). It proves that every balanced square
    selector splits all pairs, so the reduction source is ordinary PARTITION.
    Correctness, positive-square outputs, injectivity, and numerical size bounds
    are formalized. Running time, NP membership, and the NP-completeness
    consequence are proved in prose in SQUARE_PARTITION.md.
    The certificate checker verifies equal counts and integer sums; the gadget
    iff proves this sufficient and necessary. CERTIFICATES.md specifies the
    binary encoding and bit-cost semantics. The proof bounds this explicit
    semantics, not a compiled Turing machine or arbitrary Gaussian feasibility.
    The integrality explanation in SQUARE_PARTITION.md applies to outputs of
    the paired square reduction, whose total and dimension are even. Gaussian-data
    integrality is explained in prose. The threshold's membership in quarter
    integers is proved in partition_schedule_threshold_quarter_integral for
    all natural input weights. The implemented binary
    forcing block is a schedule of d+1 classes, alongside the three-class
    partition block, with all cross-block hinge penalties proved zero.

